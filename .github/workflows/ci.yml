name: 检查与顺序发布

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: 单元测试与原包校验 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装CI测试依赖
        run: python -m pip install -r requirements.txt
      - name: 检查四版原包和发布文案
        run: python scripts/verify_archives.py
      - name: 运行离线测试（不登录真实账号）
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

  release:
    name: 按版本顺序发布中文测试版
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 顺序发布待发布版本（保留历史附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_releases.py
